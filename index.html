<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel de Investimentos</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --card: #131313;
      --border: #1f1f1f;
      --text: #e8e8e8;
      --muted: #8a8a8a;
      --accent: #3b82f6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
    }
    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 16px;
      display: grid;
      gap: 16px;
    }
    .row {
      display: grid;
      gap: 16px;
    }
    .row.two   { grid-template-columns: 1fr 1fr; }
    .row.four  { grid-template-columns: repeat(4, 1fr); }

    @media (max-width: 900px) {
      .row.two, .row.four { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }
    .card h2 {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 12px 16px 4px;
    }
    .widget-wrap {
      position: relative;
      width: 100%;
    }
    .widget-wrap.h-ticker { height: 60px; }
    .widget-wrap.h-mini   { height: 240px; }
    .widget-wrap.h-mid    { height: 400px; }
    .widget-wrap.h-tall   { height: 560px; }

    .tradingview-widget-copyright {
      display: none;
    }
  </style>
</head>
<body>

<div class="container">

  <!-- TICKER TAPE -->
  <div class="card">
    <div class="widget-wrap h-ticker">
      <div class="tradingview-widget-container">
        <div class="tradingview-widget-container__widget"></div>
        <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js" async>
        {
          "symbols": [
            { "proName": "BITSTAMP:BTCUSD",  "title": "Bitcoin" },
            { "description": "Dólar",          "proName": "FX_IDC:USDBRL" },
            { "description": "IBOVESPA",       "proName": "INDEX:IBOV" },
            { "description": "S&P 500",        "proName": "FOREXCOM:SPXUSD" },
            { "description": "Nasdaq",         "proName": "NASDAQ:IXIC" },
            { "description": "IBM",            "proName": "NYSE:IBM" },
            { "description": "Vale",           "proName": "BMFBOVESPA:VALE3" },
            { "description": "Petrobras",      "proName": "BMFBOVESPA:PETR3" },
            { "description": "Itaú",           "proName": "BMFBOVESPA:ITUB4" },
            { "description": "BOVA11",         "proName": "BMFBOVESPA:BOVA11" }
          ],
          "showSymbolLogo": true,
          "isTransparent": true,
          "displayMode": "adaptive",
          "colorTheme": "dark",
          "locale": "br"
        }
        </script>
      </div>
    </div>
  </div>

  <!-- ROW: MARKET OVERVIEW + STOCK HEATMAP -->
  <div class="row two">
    <div class="card">
      <h2>Visão Geral dos Mercados</h2>
      <div class="widget-wrap h-mid">
        <div class="tradingview-widget-container">
          <div class="tradingview-widget-container__widget"></div>
          <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-market-overview.js" async>
          {
            "colorTheme": "dark",
            "dateRange": "12M",
            "showChart": true,
            "locale": "br",
            "largeChartUrl": "",
            "isTransparent": true,
            "showSymbolLogo": true,
            "showFloatingTooltip": true,
            "width": "100%",
            "height": "100%",
            "plotLineColorGrowing": "rgba(59, 130, 246, 1)",
            "plotLineColorFalling": "rgba(244, 63, 94, 1)",
            "gridLineColor": "rgba(42, 46, 57, 0)",
            "scaleFontColor": "rgba(232, 232, 232, 1)",
            "belowLineFillColorGrowing": "rgba(59, 130, 246, 0.12)",
            "belowLineFillColorFalling": "rgba(244, 63, 94, 0.12)",
            "belowLineFillColorGrowingBottom": "rgba(59, 130, 246, 0)",
            "belowLineFillColorFallingBottom": "rgba(244, 63, 94, 0)",
            "symbolActiveColor": "rgba(59, 130, 246, 0.12)",
            "tabs": [
              {
                "title": "Brasil",
                "symbols": [
                  { "s": "INDEX:IBOV",           "d": "IBOVESPA" },
                  { "s": "BMFBOVESPA:BOVA11",    "d": "BOVA11" },
                  { "s": "BMFBOVESPA:VALE3",     "d": "Vale" },
                  { "s": "BMFBOVESPA:PETR3",     "d": "Petrobras" },
                  { "s": "BMFBOVESPA:ITUB4",     "d": "Itaú" }
                ]
              },
              {
                "title": "EUA",
                "symbols": [
                  { "s": "FOREXCOM:SPXUSD",  "d": "S&P 500" },
                  { "s": "NASDAQ:IXIC",      "d": "Nasdaq" },
                  { "s": "NYSE:IBM",         "d": "IBM" },
                  { "s": "NASDAQ:AAPL",      "d": "Apple" },
                  { "s": "NASDAQ:MSFT",      "d": "Microsoft" }
                ]
              },
              {
                "title": "Cripto/Câmbio",
                "symbols": [
                  { "s": "BITSTAMP:BTCUSD", "d": "Bitcoin" },
                  { "s": "BITSTAMP:ETHUSD", "d": "Ethereum" },
                  { "s": "FX_IDC:USDBRL",   "d": "USD/BRL" },
                  { "s": "FX_IDC:EURBRL",   "d": "EUR/BRL" }
                ]
              }
            ]
          }
          </script>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>Mapa de Calor — IBOVESPA</h2>
      <div class="widget-wrap h-mid">
        <div class="tradingview-widget-container">
          <div class="tradingview-widget-container__widget"></div>
          <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-stock-heatmap.js" async>
          {
            "exchanges": ["BMFBOVESPA"],
            "dataSource": "SENSEX",
            "grouping": "sector",
            "blockSize": "market_cap_basic",
            "blockColor": "change",
            "locale": "br",
            "symbolUrl": "",
            "colorTheme": "dark",
            "hasTopBar": false,
            "isDataSetEnabled": false,
            "isZoomEnabled": true,
            "hasSymbolTooltip": true,
            "isMonoSize": false,
            "width": "100%",
            "height": "100%"
          }
          </script>
        </div>
      </div>
    </div>
  </div>

  <!-- ROW: MINI CHARTS DA SUA CARTEIRA -->
  <div class="card">
    <h2>Sua Carteira — Mini Gráficos</h2>
    <div class="row four" style="padding: 12px;">

      <div class="widget-wrap h-mini">
        <div class="tradingview-widget-container">
          <div class="tradingview-widget-container__widget"></div>
          <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-mini-symbol-overview.js" async>
          {
            "symbol": "BMFBOVESPA:BOVA11",
            "width": "100%",
            "height": "100%",
            "locale": "br",
            "dateRange": "12M",
            "colorTheme": "dark",
            "isTransparent": true,
            "autosize": true,
            "largeChartUrl": "",
            "chartOnly": false,
            "noTimeScale": false
          }
          </script>
        </div>
      </div>

      <div class="widget-wrap h-mini">
        <div class="tradingview-widget-container">
          <div class="tradingview-widget-container__widget"></div>
          <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-mini-symbol-overview.js" async>
          {
            "symbol": "NYSE:IBM",
            "width": "100%",
            "height": "100%",
            "locale": "br",
            "dateRange": "12M",
            "colorTheme": "dark",
            "isTransparent": true,
            "autosize": true
          }
          </script>
        </div>
      </div>

      <div class="widget-wrap h-mini">
        <div class="tradingview-widget-container">
          <div class="tradingview-widget-container__widget"></div>
          <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-mini-symbol-overview.js" async>
          {
            "symbol": "BMFBOVESPA:VALE3",
            "width": "100%",
            "height": "100%",
            "locale": "br",
            "dateRange": "12M",
            "colorTheme": "dark",
            "isTransparent": true,
            "autosize": true
          }
          </script>
        </div>
      </div>

      <div class="widget-wrap h-mini">
        <div class="tradingview-widget-container">
          <div class="tradingview-widget-container__widget"></div>
          <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-mini-symbol-overview.js" async>
          {
            "symbol": "BMFBOVESPA:PETR3",
            "width": "100%",
            "height": "100%",
            "locale": "br",
            "dateRange": "12M",
            "colorTheme": "dark",
            "isTransparent": true,
            "autosize": true
          }
          </script>
        </div>
      </div>

    </div>
  </div>

  <!-- ADVANCED CHART -->
  <div class="card">
    <h2>Gráfico Avançado — IBOVESPA</h2>
    <div class="widget-wrap h-tall">
      <div class="tradingview-widget-container">
        <div class="tradingview-widget-container__widget"></div>
        <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js" async>
        {
          "autosize": true,
          "symbol": "INDEX:IBOV",
          "interval": "D",
          "timezone": "America/Sao_Paulo",
          "theme": "dark",
          "style": "1",
          "locale": "br",
          "toolbar_bg": "#131313",
          "enable_publishing": false,
          "withdateranges": true,
          "hide_side_toolbar": false,
          "allow_symbol_change": true,
          "details": true,
          "studies": ["STD;EMA", "STD;RSI"],
          "container_id": "tradingview_advanced"
        }
        </script>
      </div>
    </div>
  </div>

</div>

</body>
</html>
